name: Check source drift

# Answers only "has suqo-claude-plugins moved since our last sync" - never
# blocks a PR (that's verify-sync.yml's job, pinned to .source-sync so it
# can't be tripped up by this). Runs weekly and opens an issue if the
# source has moved, so a human decides when to re-sync instead of every
# open PR going red the moment upstream changes.

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the pinned SHA against suqo-claude-plugins' live main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(cat .source-sync)
          live=$(gh api repos/suqo-ai/suqo-claude-plugins/commits/main --jq '.sha')
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          if [ "$pinned" != "$live" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      # Refreshes an already-open issue's body instead of just skipping it,
      # found by review: the original version exited as soon as any open
      # issue existed, so if the source drifted again while that issue
      # was still open, the "Live SHA" it recorded went stale - anyone
      # acting on the issue later would re-sync to the wrong commit.
      # Editing the body every run keeps it accurate no matter how many
      # weeks pass before someone re-syncs. The title deliberately carries
      # no SHAs (a second review round caught that an embedded-SHA title
      # goes stale the same way the body used to - "has moved: abc -> def"
      # while the refreshed body already says something else) - it's a
      # stable pointer to "go read the body", not a record of any one
      # drift event.
      - name: Open or refresh the drift issue
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.check.outputs.pinned }}
          LIVE: ${{ steps.check.outputs.live }}
        run: |
          {
            echo "suqo-claude-plugins' main branch has moved since the last sync recorded in \`.source-sync\`."
            echo ""
            echo "- Pinned SHA: \`$PINNED\`"
            echo "- Live SHA (as of this check): \`$LIVE\`"
            echo ""
            echo "Re-run \`agy plugin import\` against the live source, commit the result, and update \`.source-sync\` to \`$LIVE\`."
            echo ""
            echo "This issue is opened and kept up to date automatically by the weekly drift check (.github/workflows/check-source-drift.yml) - its body reflects the live SHA as of the most recent run, not necessarily the one from when it was first opened. It does not block any PR - verify-sync.yml stays pinned to the recorded SHA until a sync commit updates it."
          } > /tmp/drift-issue-body.md

          existing=$(gh issue list --search "\"suqo-claude-plugins has moved past .source-sync\" in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/drift-issue-body.md
            echo "Refreshed issue #$existing with the current live SHA ($LIVE)."
          else
            gh issue create \
              --title "suqo-claude-plugins has moved past .source-sync" \
              --body-file /tmp/drift-issue-body.md
          fi
