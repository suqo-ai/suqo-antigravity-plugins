name: Verify Antigravity sync

# One check on every PR to main (and on every direct push to main - see
# below): does what's committed at the repo root (plugin.json, skills/)
# actually match what the official Antigravity CLI's Claude importer
# (plus our rename/reconcile step) produces from suqo-claude-plugins at
# the commit recorded in .source-sync?
#
# Mostly no reconcile-script tests here, unlike suqo-codex-plugins and
# suqo-cursor-plugins - this port doesn't use acplugin or any custom
# conversion logic we wrote. `agy plugin import` (the official, first-party
# importer) does the whole job correctly by itself, with two exceptions,
# both confirmed by reading its real output, not assumed:
# `agy plugin import` always names the plugin after the source with no
# rename flag of its own, and it silently drops homepage/license/keywords
# and carries over the source's own "Claude skills..." description
# (agy plugin validate accepts all of those fields fine - this is lost
# metadata, not a schema limitation). tools/rename-plugin-manifest.mjs
# fixes both, in the pipeline instead of by hand-editing the committed
# plugin.json - its tests run here.
#
# `agy plugin import` and `agy plugin validate` don't require being
# logged into a Google account (only live prompt queries do), so this
# runs with no credentials stored in CI at all.
#
# Pinned to .source-sync's recorded SHA, not suqo-claude-plugins' live
# main, same reasoning as the other two repos' verify-sync.yml: an
# unrelated PR here shouldn't go red just because upstream moved. That
# question is check-source-drift.yml's job instead, on a schedule,
# opening an issue rather than blocking anything.
#
# push: branches: [main] - added after a real gap: this workflow used to
# run on pull_request only, so a commit pushed straight to main (as one
# was, hand-fixing exactly the description bug this workflow's rename
# step now fixes properly) never got checked at all. Direct pushes to
# main should be rare, but when they happen they need the same check a PR
# gets - branch protection requiring PRs would be the more complete fix,
# but isn't something this workflow file can enforce on its own.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-rename-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run rename script tests
        run: node --test tools/*.test.mjs

  verify-in-sync-with-source:
    runs-on: ubuntu-latest
    needs: test-rename-script
    steps:
      - name: Checkout suqo-antigravity-plugins (this repo, the PR's branch)
        uses: actions/checkout@v4
        with:
          path: antigravity-plugins

      - name: Read the pinned source SHA
        id: pinned
        run: echo "sha=$(cat antigravity-plugins/.source-sync)" >> "$GITHUB_OUTPUT"

      # No token: — relies on suqo-claude-plugins staying public. If that
      # changes, this step starts failing with an auth error that won't
      # obviously point back to this line.
      - name: Checkout suqo-claude-plugins at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: suqo-ai/suqo-claude-plugins
          ref: ${{ steps.pinned.outputs.sha }}
          path: claude-plugins

      # Unlike acplugin (pinned to an exact version everywhere it's used),
      # this always installs whatever the official installer currently
      # calls latest — confirmed there's no supported way to pin a specific
      # agy version: the installer's manifest URL is hardcoded, no version
      # argument or env var overrides it. Accepted, not fixed: if a future
      # agy release changes what `plugin import` produces, this check could
      # start failing for reasons unrelated to any actual PR content.
      - name: Install the Antigravity CLI
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import the plugin with the official importer
        run: |
          AGY="$HOME/.local/bin/agy"
          "$AGY" plugin import "$GITHUB_WORKSPACE/claude-plugins"

      # agy plugin import always names the plugin after the source and
      # drops homepage/license/keywords while keeping the source's own
      # "Claude skills..." description - all fixed here, in the pipeline,
      # so none of it can get silently reverted by a future run (including
      # a direct push to main, now that this workflow runs on push too).
      # See tools/rename-plugin-manifest.mjs's doc comment for why.
      #
      # This step's --description text is this repo's one canonical copy -
      # README.md's manual re-sync section has to repeat it (a shell
      # command in a code block can't `source` this workflow file), but
      # keep the two in sync by hand if it ever changes here; a mismatch
      # is silent (the README's copy is never executed by CI).
      - name: Rename and reconcile the plugin manifest
        run: |
          node antigravity-plugins/tools/rename-plugin-manifest.mjs \
            "$HOME/.gemini/config/plugins/suqo-claude-plugins/plugin.json" \
            suqo-antigravity-plugins \
            --source claude-plugins/.claude-plugin/plugin.json \
            --description "Skills and SDK usage guides for building apps on top of the SUQO PHP and TypeScript SDKs."

      - name: Validate the renamed plugin
        run: |
          AGY="$HOME/.local/bin/agy"
          "$AGY" plugin validate "$HOME/.gemini/config/plugins/suqo-claude-plugins"

      - name: Diff the import output against what's actually committed
        run: |
          set -e
          staged="$HOME/.gemini/config/plugins/suqo-claude-plugins"
          if ! diff -q "$staged/plugin.json" antigravity-plugins/plugin.json; then
            echo "::error::plugin.json in this PR does not match what 'agy plugin import' produces from suqo-claude-plugins@${{ steps.pinned.outputs.sha }} (the SHA recorded in .source-sync). Re-import and commit the result - if you're intentionally syncing to a newer source commit, update .source-sync to that SHA too."
            exit 1
          fi
          if ! diff -rq "$staged/skills" antigravity-plugins/skills; then
            echo "::error::skills/ in this PR does not match what 'agy plugin import' produces from suqo-claude-plugins@${{ steps.pinned.outputs.sha }}. Re-import and commit the result."
            exit 1
          fi
          echo "In sync with suqo-ai/suqo-claude-plugins@${{ steps.pinned.outputs.sha }}."
