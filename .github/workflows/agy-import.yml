name: Import via Antigravity CLI (CI-side)

# Runs the one step of the sync procedure that the sync routine's own
# sandboxed session cannot do itself: installing and running the real
# `agy` CLI. That sandbox's egress proxy rejects `antigravity.google` and
# the private Cloud Run URL its installer redirects to (confirmed by direct
# testing, not assumed) - unlike `acplugin` (an npm package, used for the
# Codex/Cursor ports), `agy` has no install path that goes through an
# already-allowed host. GitHub Actions runners have no such restriction -
# confirmed by verify-sync.yml's own real runs, which install and use the
# same CLI successfully on every PR.
#
# This workflow does ONLY the conversion, not the full sync. It does not
# commit, push, or open a PR - `permissions: contents: read` throughout,
# matching every other workflow in this repo (none of them have ever been
# granted write access; adding that here would be a bigger, separate
# change this fix doesn't need). The routine that triggers this
# (workflow_dispatch, passing the exact source commit to import) downloads
# this run's `antigravity-import` artifact afterward and does everything
# else itself - diffing, committing, opening the PR - exactly as it
# already does for the Codex and Cursor ports. See .sync/PROCEDURE.md in
# suqo-claude-plugins (Antigravity section) for the full procedure this
# is one step of.
#
# Steps mirror verify-sync.yml's install/import/rename/prune sequence
# exactly, since that sequence is already proven correct by every real PR
# check this repo runs - this workflow does not invent a second way to do
# the same conversion.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact commit SHA in suqo-ai/suqo-claude-plugins to import from (not a branch name - the routine resolves main to its current SHA before dispatching, so this run stays reproducible even if main moves again before the artifact is picked up)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  agy-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout suqo-antigravity-plugins (this repo, for tools/)
        uses: actions/checkout@v4
        with:
          path: antigravity-plugins

      # No token: - relies on suqo-claude-plugins staying public, same as
      # verify-sync.yml.
      - name: Checkout suqo-claude-plugins at the requested SHA
        uses: actions/checkout@v4
        with:
          repository: suqo-ai/suqo-claude-plugins
          ref: ${{ inputs.source_sha }}
          path: claude-plugins

      # Same caveat as verify-sync.yml: no supported way to pin a specific
      # agy version, always installs whatever the official installer
      # currently calls latest.
      - name: Install the Antigravity CLI
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import the plugin with the official importer
        run: |
          AGY="$HOME/.local/bin/agy"
          "$AGY" plugin import "$GITHUB_WORKSPACE/claude-plugins"

      # Same fix verify-sync.yml already applies to every import - agy's
      # own output always needs this correcting, not something specific to
      # this workflow.
      - name: Rename and reconcile the plugin manifest
        run: |
          node antigravity-plugins/tools/rename-plugin-manifest.mjs \
            "$HOME/.gemini/config/plugins/suqo-claude-plugins/plugin.json" \
            suqo-antigravity-plugins \
            --source claude-plugins/.claude-plugin/plugin.json \
            --description "Skills and SDK usage guides for building apps on top of the SUQO PHP and TypeScript SDKs."

      # Same prune verify-sync.yml does - agy's raw output carries .git/,
      # .claude/, .claude-plugin/, LICENSE, README.md that don't belong in
      # what actually ships.
      - name: Prune into a clean directory - this is what the routine picks up
        run: |
          staged="$HOME/.gemini/config/plugins/suqo-claude-plugins"
          pruned="$GITHUB_WORKSPACE/pruned"
          rm -rf "$pruned"
          mkdir -p "$pruned"
          cp "$staged/plugin.json" "$pruned/"
          cp -r "$staged/skills" "$pruned/"

      - name: Validate the pruned plugin before handing it off
        run: |
          AGY="$HOME/.local/bin/agy"
          "$AGY" plugin validate "$GITHUB_WORKSPACE/pruned"

      - name: Upload the pruned output for the routine to download
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-import
          path: pruned/
          retention-days: 1
